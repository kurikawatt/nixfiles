# -------------
#  MAIN CONFIG
# -------------

# Import splitted parts
source=./keybinds.conf
source=./autostart.conf
source=./monitors.conf

# Mess
syncobj_enable=1

# Keyboard
xkb_rules_layout=fr
numlockon=1

# Trackpad
trackpad_natural_scrolling=1

# Mouse
mouse_natural_scrolling=0

# Layout
circle_layout=monocle,tile
tagrule=id:1,layout_name:monocle
tagrule=id:2,layout_name:tile

# Theming
borderpx = 0;
gappoh = 0;
gappov = 0;

# Monocle top bar
tab_bar_height = 30
text_decorate_fg_color=0xe0def4ff
text_decorate_bg_color=0x191724ff
text_decorate_border_width = 1
text_decorate_corner_radius = 0
text_decorate_padding_x = 2
text_decorate_padding_y = 2
text_decorate_font_desc = Cascadia Mono 5

# Jump appearance
jump_label_decorate_font_desc = Cascadia Mono 24

