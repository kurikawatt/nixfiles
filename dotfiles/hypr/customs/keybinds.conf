$mainMod = SUPER

# -- Hyprland Ecosystem --
# Quit hyprland
bind = $mainMod, M, exit
# Lock the computer
bind = $mainMod, L, exec, hyprlock

# -- Controlling some stuff --
# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# Move Windows (may be usefull sometimes)
bind = $mainMod, mouse:272, movewindow
bindm = SUPER_SHIFT, mouse:272, resizewindow
bindm = SUPER_SHIFT_ALT, mouse:272, resizewindow 1

# Floating
bind = SUPER_SHIFT, f, exec, ~/scripts/hypr_toggle_float.sh # togglefloating

# -- Theme Switch --
bind = SUPER_SHIFT, t, exec, ~/scripts/theme_switcher.sh

# Sound
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brightness
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Close programs
bind = $mainMod, C, killactive

# Floating window
# bind = $mainMod, V, togglefloating,

# dwindle specific
# bind = $mainMod, P, pseudo,
# bind = $mainMod, J, togglesplit,

# Workspaces
bind = SUPER_SHIFT, left, movetoworkspace, -1
bind = SUPER_SHIFT, right, movetoworkspace, +1

# Mako
bind = SUPER_SHIFT, M, exec, makoctl mode -t do-not-disturb

# Display / Hide Waybar
bind = SUPER_SHIFT, B, exec, pkill -USR1 waybar

# Screenshot (all screen)
bind = $mainMod, Print, exec, grim ~/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png
$grimxslurp = grim -g "$(slurp)" ~/Screenshots/$(date +%Y-%m-%d-%H-%M-%S).png
bind = , Print, exec, $grimxslurp 

# -- Open programs --
$terminal = kitty
$webBrowser = zen
$fileManager = kitty -e "yazi"
#$menu = wofi --show drun
$menu = fuzzel

bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, $webBrowser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
