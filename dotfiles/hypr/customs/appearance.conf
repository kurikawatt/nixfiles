$accentColor = rgba(EC4067FF)

general {
	gaps_in = 0
	gaps_out = 0

	border_size = 0

	#col.active_border = $accentColor
	#col.inactive_border = rgba(595959aa)

	resize_on_border = false

	allow_tearing = false

	layout = dwindle
}

decoration {
	rounding = 0
	rounding_power = 2

	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

	blur {
		enabled = true
		size = 3
		passes = 1

		vibrancy = 0.1696
	}
}

dwindle {
	pseudotile = true
	preserve_split = true
}

master {
	new_status = master
}

misc {
	force_default_wallpaper = -1
	disable_hyprland_logo = true # i like anime girl, but sorry...
}
