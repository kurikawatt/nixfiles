# Kurikawa's Kitty Configuration

# -- Fonts --
font_family      family="Cascadia Code"
bold_font        auto
italic_font      auto
bold_italic_font auto

# -- Window --
window_padding_width 8

# -- Backgrounds --
#background #061826
background_opacity 0.95
dynamic_background_opacity no

active_tab_background #EC4067
inactive_tab_foreground #EC4067
inactive_tab_background #061826

# -- Keybinds --

# Reload kitty conf
map ctrl+shift+r load_config_file

# Window management
map ctrl+shift+n new_os_window

# Copy / Paste
copy_on_select no
map ctrl+shift+c copy_to_clipboard

paste_actions replace-dangerous-control-codes
map ctrl+shift+v paste_from_clipboard
